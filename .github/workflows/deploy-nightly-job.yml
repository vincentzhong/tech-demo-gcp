name: deploy-nightly-job

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/nightly-job/**'
      - '.github/workflows/deploy-nightly-job.yml'

env:
  GCP_PROJECT_ID: "tech-demo-481009"
  GCP_REGION: "us-central1"
  GAR_REPOSITORY: "demo-api" # Assuming reusing the existing repo
  JOB_NAME: "nightly-cleanup-job"

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/nightly-job:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./src/nightly-job
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update Cloud Run Job
        # This step updates the job with the new image.
        # It assumes the job has already been created via Terraform.
        run: |
          gcloud run jobs update "$JOB_NAME" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --quiet
