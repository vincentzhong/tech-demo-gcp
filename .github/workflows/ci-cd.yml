name: ci-cd

on:
  push:
    branches: [ main ]
  pull_request:

env:
  DOTNET_VERSION: "9.0.x"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'demo-api' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'books-api' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build & Test
        run: dotnet test --no-build --verbosity normal

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Terraform Init
        working-directory: terraform/app
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_repository_id: ${{ env.GAR_REPOSITORY }}
          TF_VAR_service_name: ${{ env.SERVICE_NAME }}
          TF_VAR_image: ${{ env.IMAGE }}
          TF_VAR_api_key: ${{ env.API_KEY }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Plan
        working-directory: terraform/app
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_repository_id: ${{ env.GAR_REPOSITORY }}
          TF_VAR_service_name: ${{ env.SERVICE_NAME }}
          TF_VAR_image: ${{ env.IMAGE }}
          TF_VAR_api_key: ${{ env.API_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/app
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_repository_id: ${{ env.GAR_REPOSITORY }}
          TF_VAR_service_name: ${{ env.SERVICE_NAME }}
          TF_VAR_image: ${{ env.IMAGE }}
          TF_VAR_api_key: ${{ env.API_KEY }}
        run: terraform apply -auto-approve tfplan

